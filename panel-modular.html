<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ValueScale Controls</title>
<link rel="stylesheet" href="ui/styles.css">
<link rel="stylesheet" href="ui/panel-card.css">
<style>
  html, body { margin: 0; background: transparent; font: 12px -apple-system, "Segoe UI", sans-serif; color: var(--white); user-select: none; }
</style>
</head>
<body>
<div class="card">
  <details id="window-options" class="window-options">
    <summary>Window options</summary>
    <div class="row">
      <div class="label"><span>Window</span></div>
      <select id="window-list"></select>
      <div class="actions">
        <button id="refresh-windows" type="button">Refresh</button>
      </div>
      <p class="note">Only the chosen window is captured; other floating windows are excluded.</p>
    </div>
    <div id="source-error" class="error" hidden></div>
    <div class="row">
      <div class="label"><span>Capture area</span></div>
      <div class="actions">
        <button id="select-area" type="button">Select capture area</button>
        <button id="reset-area" type="button">Reset capture area</button>
      </div>
    </div>
  </details>
  <div class="row">
    <div class="label"><span>Gray values</span><span class="slider-value"><b id="vl"></b><button class="slider-reset" type="button" data-setting="levels" aria-label="Reset gray values" title="Reset gray values">↻</button></span></div>
    <div class="slider">
      <input id="levels" type="range" min="0" max="8" step="1" aria-label="Gray values">
      <span class="slider-tick-track"><span class="slider-tick" style="--default-position: 50%"></span></span>
    </div>
  </div>
  <div class="row">
    <div class="label"><span>Brightness</span><span class="slider-value"><b id="vb"></b><button class="slider-reset" type="button" data-setting="brightness" aria-label="Reset brightness" title="Reset brightness">↻</button></span></div>
    <div class="slider">
      <input id="brightness" type="range" min="-100" max="100" step="1" aria-label="Brightness adjustment">
      <span class="slider-tick-track"><span class="slider-tick" style="--default-position: 50%"></span></span>
    </div>
  </div>
  <div class="row">
    <div class="label"><span>Contrast</span><span class="slider-value"><b id="vc"></b><button class="slider-reset" type="button" data-setting="contrast" aria-label="Reset contrast" title="Reset contrast">↻</button></span></div>
    <div class="slider">
      <input id="contrast" type="range" min="-100" max="100" step="1" aria-label="Contrast adjustment">
      <span class="slider-tick-track"><span class="slider-tick" style="--default-position: 50%"></span></span>
    </div>
  </div>
  <label class="toggle"><input id="posterize" type="checkbox"> Posterize</label>
  <label class="toggle"><input id="quick-filter-buttons" type="checkbox"> Show quick filter buttons</label>
  <div id="quick-filter-error" class="error" role="alert" hidden></div>
  <div class="foot">
    <span id="app-version">ValueScale · Version unavailable</span>
    <span>by LuisDiegoArt</span>
  </div>
</div>
<script>
const els = {
  levels: document.getElementById('levels'),
  brightness: document.getElementById('brightness'),
  contrast: document.getElementById('contrast'),
};
const posterize = document.getElementById('posterize');
const quickFilterButtons = document.getElementById('quick-filter-buttons');
const quickFilterError = document.getElementById('quick-filter-error');
const windowOptions = document.getElementById('window-options');
const windowList = document.getElementById('window-list');
const sourceError = document.getElementById('source-error');
window.api.getAppVersion().then((version) => {
  document.getElementById('app-version').textContent = `ValueScale v${version}`;
}).catch((error) => {
  console.error('Failed to retrieve app version:', error);
});
let currentSettings = null;
const adjustmentRange = { min: -100, max: 100 };
const settingRanges = {
  brightness: { min: -100, neutral: 10, max: 100 },
  contrast: { min: 0.5, neutral: 1.43, max: 3 },
};
const out = {
  levels: document.getElementById('vl'),
  brightness: document.getElementById('vb'),
  contrast: document.getElementById('vc'),
};
function toAdjustment(key, value) {
  const range = settingRanges[key];
  const adjustment = value < range.neutral
    ? (value - range.neutral) / (range.neutral - range.min) * 100
    : (value - range.neutral) / (range.max - range.neutral) * 100;
  return Math.round(Math.max(adjustmentRange.min, Math.min(adjustmentRange.max, adjustment)));
}
function toSetting(key, adjustment) {
  const range = settingRanges[key];
  const value = adjustment < 0
    ? range.neutral + (adjustment / 100) * (range.neutral - range.min)
    : range.neutral + (adjustment / 100) * (range.max - range.neutral);
  return key === 'brightness' ? Math.round(value) : Math.round(value * 100) / 100;
}
function formatAdjustment(key, value) {
  const formatted = value > 0 ? `+${value}` : value;
  return key === 'brightness' ? `${formatted}%` : formatted;
}
windowOptions.addEventListener('toggle', () => {
  window.api.resizePanel(windowOptions.open);
});
window.api.onOpenWindowOptions(() => {
  windowOptions.open = true;
});
function show(s) {
  for (const k in els) {
    const value = k === 'levels' ? s[k] - 2 : toAdjustment(k, s[k]);
    els[k].value = value;
    out[k].textContent = formatAdjustment(k, value);
  }
  posterize.checked = s.posterize;
  quickFilterButtons.checked = s.showQuickFilterButtons;
}
function showError(error) {
  sourceError.textContent = error && error.message ? error.message : String(error);
  sourceError.hidden = false;
}
async function refreshWindows(selectedName) {
  const windows = await window.api.listCaptureWindows();
  windowList.replaceChildren();
  const placeholder = document.createElement('option');
  placeholder.value = '';
  placeholder.textContent = windows.length ? 'Select an application window' : 'No application windows found';
  placeholder.disabled = true;
  placeholder.selected = true;
  windowList.append(placeholder);
  if (!windows.length) {
    return;
  }
  for (const source of windows) {
    const option = document.createElement('option');
    option.value = source.id;
    option.textContent = source.name;
    windowList.append(option);
  }
  if (selectedName) {
    const selected = windows.find((source) => source.name === selectedName);
    if (selected) windowList.value = selected.id;
  }
}
function applySettings(s) {
  const sourceChanged = !currentSettings
    || currentSettings.captureWindowName !== s.captureWindowName;
  currentSettings = s;
  show(s);
  if (sourceChanged) refreshWindows(s.captureWindowName).catch(showError);
}
window.api.getSettings().then(applySettings).catch(showError);
window.api.onSettings(applySettings);
for (const k in els) {
  els[k].addEventListener('input', () => {
    const value = Number(els[k].value);
    const setting = k === 'levels' ? value + 2 : toSetting(k, value);
    out[k].textContent = formatAdjustment(k, value);
    window.api.setSettings({ [k]: setting });
  });
}
const sliderDefaults = { levels: 4, brightness: 0, contrast: 0 };
document.querySelectorAll('.slider-reset').forEach((button) => {
  button.addEventListener('click', () => {
    const key = button.dataset.setting;
    const value = sliderDefaults[key];
    els[key].value = value;
    out[key].textContent = formatAdjustment(key, value);
    window.api.setSettings({ [key]: key === 'levels' ? value + 2 : toSetting(key, value) });
  });
});
document.getElementById('refresh-windows').addEventListener('click', () => {
  sourceError.hidden = true;
  refreshWindows(currentSettings && currentSettings.captureWindowName).catch(showError);
});
windowList.addEventListener('change', async () => {
  if (!windowList.value) return;
  sourceError.hidden = true;
  try {
    await window.api.selectCaptureTarget({ type: 'window', id: windowList.value });
  } catch (error) {
    showError(error);
  }
});
document.getElementById('select-area').addEventListener('click', async () => {
  sourceError.hidden = true;
  try {
    await window.api.startCropSelection();
    window.close();
  } catch (error) {
    showError(error);
  }
});
document.getElementById('reset-area').addEventListener('click', async () => {
  sourceError.hidden = true;
  try {
    await window.api.setCrop({ x: 0, y: 0, w: 1, h: 1 });
  } catch (error) {
    showError(error);
  }
});
posterize.addEventListener('change', () => {
  window.api.setSettings({ posterize: posterize.checked });
});
quickFilterButtons.addEventListener('change', async () => {
  quickFilterError.hidden = true;
  quickFilterButtons.disabled = true;
  try {
    await window.api.setQuickFilterButtons(quickFilterButtons.checked);
  } catch (error) {
    quickFilterButtons.checked = currentSettings.showQuickFilterButtons;
    quickFilterError.textContent = error && error.message ? error.message : String(error);
    quickFilterError.hidden = false;
  } finally {
    quickFilterButtons.disabled = false;
  }
});
addEventListener('keydown', (e) => { if (e.key === 'Escape') window.close(); });
</script>
</body>
</html>
