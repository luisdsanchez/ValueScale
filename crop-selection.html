<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Select capture area</title>
<style>
  :root { --accent: #FF6C38; --white: #f5f5f5; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { position: relative; background: transparent; cursor: crosshair; user-select: none; }
  #source {
    position: fixed;
    top: 50%;
    left: 50%;
    display: block;
    max-width: calc(100vw - 80px);
    max-height: calc(100vh - 112px);
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  #overlay {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
    touch-action: none;
  }
  #error {
    position: fixed;
    bottom: 16px;
    left: 50%;
    z-index: 1;
    padding: 8px 12px;
    border-radius: 5px;
    background: rgba(30, 30, 30, 0.94);
    color: var(--accent);
    font: 13px "Segoe UI", sans-serif;
    transform: translateX(-50%);
    pointer-events: none;
    white-space: nowrap;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<video id="source" muted autoplay hidden></video>
<canvas id="overlay"></canvas>
<div id="error" hidden></div>
<script>
const video = document.getElementById('source');
const canvas = document.getElementById('overlay');
const context = canvas.getContext('2d');
const error = document.getElementById('error');
let selectionRegion = null;
let selectionStart = null;
let stream = null;
let closing = false;

function showError(message) {
  error.textContent = message;
  error.hidden = false;
}

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function getPreviewRect() {
  if (!video.videoWidth || !video.videoHeight) return null;
  const aspect = video.videoWidth / video.videoHeight;
  const maxWidth = Math.max(1, innerWidth - 80);
  const maxHeight = Math.max(1, innerHeight - 112);
  let width = maxWidth;
  let height = width / aspect;
  if (height > maxHeight) {
    height = maxHeight;
    width = height * aspect;
  }
  const x = (innerWidth - width) / 2;
  const y = (innerHeight - height) / 2;
  return { x, y, left: x, top: y, right: x + width, bottom: y + height, width, height };
}

function getVisibleSelectionRegion() {
  if (!selectionRegion) return getPreviewRect();
  const x = selectionRegion.x;
  const y = selectionRegion.y;
  const right = x + selectionRegion.width;
  const bottom = y + selectionRegion.height;
  return {
    ...selectionRegion,
    left: clamp(x, 0, innerWidth),
    top: clamp(y, 0, innerHeight),
    right: clamp(right, 0, innerWidth),
    bottom: clamp(bottom, 0, innerHeight),
  };
}

function resizeOverlay() {
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(innerWidth * ratio));
  canvas.height = Math.max(1, Math.round(innerHeight * ratio));
  context.setTransform(ratio, 0, 0, ratio, 0, 0);
  drawOverlay();
}

function drawOverlay() {
  context.clearRect(0, 0, innerWidth, innerHeight);
  context.fillStyle = 'rgba(0, 0, 0, 0.55)';
  context.fillRect(0, 0, innerWidth, innerHeight);
  if (!selectionStart) return;

  const left = Math.min(selectionStart.x, selectionStart.currentX);
  const top = Math.min(selectionStart.y, selectionStart.currentY);
  const width = Math.abs(selectionStart.currentX - selectionStart.x);
  const height = Math.abs(selectionStart.currentY - selectionStart.y);
  context.clearRect(left, top, width, height);
  context.fillStyle = 'rgba(255, 108, 56, 0.12)';
  context.fillRect(left, top, width, height);
  context.strokeStyle = '#FF6C38';
  context.lineWidth = 1;
  context.strokeRect(left + 0.5, top + 0.5, Math.max(0, width - 1), Math.max(0, height - 1));
}

function closeStream() {
  closing = true;
  if (!stream) return;
  stream.getTracks().forEach((track) => track.stop());
  stream = null;
}

async function closeSelector() {
  closeStream();
  try {
    await window.api.finishCropSelection();
  } catch (selectionError) {
    closing = false;
    console.error('Failed to close the capture-area selector:', selectionError);
    showError('Could not close the selector. Press Esc to try again.');
  }
}

async function startPreviewCapture() {
  try {
    stream = await navigator.mediaDevices.getDisplayMedia({
      video: { frameRate: 30, cursor: 'never' },
      audio: false,
    });
    const track = stream.getVideoTracks()[0];
    if (!track) throw new Error('Capture source returned no video track.');
    track.addEventListener('ended', () => {
      if (!closing) showError('The selected window is no longer available. Press Esc to close.');
    });
    video.srcObject = stream;
    video.hidden = false;
    await video.play();
    if (!video.videoWidth) {
      await new Promise((resolve) => video.addEventListener('loadedmetadata', resolve, { once: true }));
    }
  } catch (captureError) {
    console.error('Failed to start capture-area preview:', captureError);
    showError('Could not show the selected window. Press Esc to cancel.');
  }
}

async function initialize() {
  try {
    const bounds = await window.api.getCropSelectionBounds();
    if (bounds) {
      selectionRegion = bounds;
    } else {
      await startPreviewCapture();
    }
    resizeOverlay();
  } catch (selectionError) {
    console.error('Failed to prepare the capture-area selector:', selectionError);
    showError('Could not locate the selected window. Press Esc to cancel.');
  }
}

canvas.addEventListener('pointerdown', (event) => {
  if (event.button !== 0 || selectionStart) return;
  const rect = getVisibleSelectionRegion();
  if (!rect || rect.right <= rect.left || rect.bottom <= rect.top
    || event.clientX < rect.left || event.clientX > rect.right
    || event.clientY < rect.top || event.clientY > rect.bottom) return;
  selectionStart = {
    x: event.clientX,
    y: event.clientY,
    currentX: event.clientX,
    currentY: event.clientY,
    rect,
  };
  drawOverlay();
  event.preventDefault();
});

document.addEventListener('pointermove', (event) => {
  if (!selectionStart) {
    const rect = getVisibleSelectionRegion();
    canvas.style.cursor = rect && event.clientX >= rect.left && event.clientX <= rect.right
      && event.clientY >= rect.top && event.clientY <= rect.bottom
      ? 'crosshair'
      : 'default';
    return;
  }
  const { rect } = selectionStart;
  selectionStart.currentX = clamp(event.clientX, rect.left, rect.right);
  selectionStart.currentY = clamp(event.clientY, rect.top, rect.bottom);
  drawOverlay();
});

document.addEventListener('pointerup', async (event) => {
  if (!selectionStart) return;
  const { x, y, rect } = selectionStart;
  const pointerX = clamp(event.clientX, rect.left, rect.right);
  const pointerY = clamp(event.clientY, rect.top, rect.bottom);
  selectionStart = null;
  const left = Math.min(x, pointerX);
  const top = Math.min(y, pointerY);
  const width = Math.abs(pointerX - x);
  const height = Math.abs(pointerY - y);
  if (width < 8 || height < 8) {
    showError('Drag within the selected application window to choose an area.');
    drawOverlay();
    return;
  }

  const crop = {
    x: clamp((left - rect.x) / rect.width, 0, 1),
    y: clamp((top - rect.y) / rect.height, 0, 1),
    w: Math.min(width / rect.width, 1),
    h: Math.min(height / rect.height, 1),
  };
  try {
    await window.api.setCrop(crop);
    await closeSelector();
  } catch (selectionError) {
    console.error('Failed to save capture area:', selectionError);
    showError('Could not save the selected area. Try again.');
    drawOverlay();
  }
});

document.addEventListener('pointercancel', () => {
  selectionStart = null;
  drawOverlay();
});

addEventListener('resize', resizeOverlay);
document.addEventListener('contextmenu', (event) => event.preventDefault());
addEventListener('keydown', (event) => {
  if (event.key !== 'Escape') return;
  selectionStart = null;
  closeSelector();
  event.preventDefault();
});

initialize();
</script>
</body>
</html>
